[project]
name = "climategpt-pipeline"
version = "0.1.4"
description = "Python libraries and adapters for climategpt-performance-enhancement"

dependencies = [
    # preserved/top-level deps (cleaned)
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",
    "duckdb>=0.7.0",
    "numpy>=1.25.0",
    "urllib3>=2.0.0",
    "idna>=3.4",
    "certifi>=2023.5.7",
    "pytz>=2023.3",
    "python-dateutil>=2.8.2",
    "six>=1.16.0",
    "mcp>=1.16.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    # webapp/adapters
    "flask[async]>=2.0.0",
    "pypdf>=3.0.0",
    "geopy>=2.3.0",
    "flask_cors>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


